[project]
name = "arxiv-paper-recommend"
version = "0.1.0"
description = "Retrieval-augmented arXiv paper recommendations with sparse, dense and hybrid search"
readme = "README.md"
authors = [
    { name = "CIA", email = "2ndaryuan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
vectorization = [
    "torch>=2.10,<3",
    "transformers>=4.57.1,<5",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.format]
indent-style = "tab"
